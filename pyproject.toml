[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-hook-script-generator"
version = "0.4.2"
description = "Desktop tool that generates viral hooks and short-form scripts from a topic, platform, and tone."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hook-engine maintainers" }]
keywords = ["hooks", "scripts", "shorts", "reels", "tiktok", "llm", "content"]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    "respx>=0.21",
]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.28"]

[project.scripts]
viral-hooks = "viral_hook_generator.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["viral_hook_generator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]